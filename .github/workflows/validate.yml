name: Validate shared defaults

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Validate declarative repository policy
        run: python3 scripts/repository_policy.py --validate-policy
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate default funding
        run: |
          grep -Fx 'ko_fi: ponchia' .github/FUNDING.yml
